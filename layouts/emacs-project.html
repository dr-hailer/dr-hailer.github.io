{{ define "main" }}
<header class="page-header"><h1>{{ .Title }}</h1></header>
<div class="post-content md-content">{{ .Content }}</div>
{{ range (where site.RegularPages "Params.project" "emacs-konfiguration").ByParam "series_order" }}
<article class="post-entry">
  <header class="entry-header"><h2>{{ .Title }}</h2></header>
  <div class="entry-content"><p>{{ .Description }}</p></div>
  <footer class="entry-footer">{{ partial "post_meta.html" . }}</footer>
  <a class="entry-link" href="{{ .RelPermalink }}" aria-label="{{ .Title }}"></a>
</article>
{{ end }}
{{ end }}
